# Reverse proxy in front of one or more Trading Bot shards.
#
# * TLS termination (mount certificates and enable the 443 server block),
# * gzip, rate limiting and WebSocket upgrade,
# * one location per shard: each bot container is an independent engine with its own
#   watchlist / API key / strategies, reachable under its own base path.

worker_processes auto;
events { worker_connections 4096; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    application/json text/css application/javascript;

    # Throttle the login endpoint against brute force attempts (the app also locks out clients).
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream bot_primary { server bot:8080; keepalive 32; }
    # upstream bot_shard_b { server bot-b:8080; keepalive 32; }

    server {
        listen 80;
        # For TLS: listen 443 ssl; ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;   # WebSocket connections stay open

        location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://bot_primary; }
        location /api/            { limit_req zone=api burst=100 nodelay;  proxy_pass http://bot_primary; }
        location /                { proxy_pass http://bot_primary; }

        # Additional shard under its own base path (set TRADING_BOT__WEB__BASE_PATH=/bots/b on that container):
        # location = /bots/b { return 301 /bots/b/; }
        # location /bots/b/ { proxy_pass http://bot_shard_b/; }
    }
}
