<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Create account · Trading Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="static/css/material.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231d4a8f'/%3E%3Cpath fill='%23d6e3ff' d='M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z'/%3E%3C/svg%3E">
</head>
<body class="login-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></symbol>
    <symbol id="i-login" viewBox="0 0 24 24"><path d="M11 7 9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></symbol>
  </defs>
</svg>

<main class="login-layout">
  <div class="card elevated login-card" id="signupCard">
    <div class="login-brand">
      <div class="brand"><svg class="icon"><use href="#i-chart"/></svg></div>
      <div>
        <h1 class="headline-small" style="margin:0">Create account</h1>
        <div class="body-medium muted">Trading Bot</div>
      </div>
    </div>

    <form class="stack" id="signupForm" autocomplete="on">
      <div class="text-field"><div class="field"><input id="usernameInput" name="username" placeholder=" " autocomplete="username" required autofocus maxlength="32"><label for="usernameInput">Username</label></div><div class="supporting">2-32 characters: letters, digits, . _ -</div></div>
      <div class="text-field"><div class="field"><input id="emailInput" name="email" type="email" placeholder=" " autocomplete="email"><label for="emailInput" id="emailLabel">E-mail</label></div><div class="supporting" id="emailHint"></div></div>
      <div class="text-field"><div class="field"><input id="passwordInput" name="password" type="password" placeholder=" " autocomplete="new-password" required><label for="passwordInput">Password</label></div></div>
      <div id="passwordFeedback"></div>
      <div class="text-field" id="confirmField"><div class="field"><input id="confirmInput" name="confirm" type="password" placeholder=" " autocomplete="new-password" required><label for="confirmInput">Confirm password</label></div></div>
      <div class="body-medium error-text" id="signupError" role="alert" aria-live="assertive"></div>
      <button type="submit" class="btn filled login-submit" id="signupButton"><svg class="icon"><use href="#i-login"/></svg>Create account</button>
    </form>

    <div class="stack hidden" id="verifyPanel">
      <div class="notice success" id="verifyText"></div>
      <div class="body-small muted">Did not get the e-mail? Check the spam folder or request a new link.</div>
      <div class="row"><button type="button" class="btn tonal" id="resendButton">Resend verification e-mail</button><span class="body-small muted" id="resendStatus"></span></div>
    </div>

    <div class="login-links"><a href="login" class="label-large">Already have an account? Sign in</a></div>
  </div>
</main>

<script type="module" src="static/js/signup.js"></script>
</body>
</html>
