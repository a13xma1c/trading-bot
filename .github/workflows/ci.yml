name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.9.x"

jobs:
  # ------------------------------------------------------------------ quality
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check . || true   # formatting is advisory; `ruff check` is the gate
      - run: uv run mypy tests trading_bot

  # --------------------------------------------------------------------- tests
  tests:
    name: Test suite (Playwright container)
    runs-on: ubuntu-latest
    # Official Playwright image: browsers and system libraries preinstalled; the tag must match the
    # pinned `playwright` package version in pyproject.toml.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
      - name: Run tests (unit, API, end-to-end browser, scalability smoke)
        run: uv run pytest -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/

  # ----------------------------------------------------------------- container
  container:
    name: Container build, tests & load test
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: trading-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: trading-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (starts without any configuration, serves health + login page)
        run: |
          docker run -d --name smoke -p 18080:8080 -e TRADING_BOT__DATA__PROVIDER=demo trading-bot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health 2>/dev/null; then ok=1; break; fi; sleep 1
          done
          echo
          [ "${ok:-}" = 1 ] || { docker logs smoke; exit 1; }
          curl -fsS http://127.0.0.1:18080/api/ready
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18080/login | grep -q 200
          # anonymous API access is refused
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/status)" = "401" ]
          docker exec smoke id -u | grep -qx 1000   # runs unprivileged
          docker rm -f smoke
      - name: Prepare report directory
        # Bind-mounted into containers that run as an unprivileged user (UID 1000), while the
        # runner's checkout is owned by a different UID: make it world-writable.
        run: mkdir -p reports && chmod -R a+rwX reports
      - name: Unit / API / scalability tests inside the container
        run: docker compose -f docker-compose.ci.yml --profile tests run --rm unit-tests
      - name: Load / scalability test (300 WebSocket clients, 30 HTTP users, 30 s)
        run: |
          docker compose -f docker-compose.ci.yml up --abort-on-container-exit --exit-code-from loadtest
      - name: Show load test report
        if: always()
        run: cat reports/loadtest.json || true
      - name: Collect container logs
        if: always()
        run: docker compose -f docker-compose.ci.yml logs --no-color > reports/compose.log || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-reports
          path: reports/

  # ------------------------------------------------------------------- publish
  publish:
    name: Publish image (GHCR)
    runs-on: ubuntu-latest
    needs: [tests, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
